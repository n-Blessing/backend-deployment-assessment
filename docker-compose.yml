name: muchtodo

services:
  backend:
    build:
      context: .
      additional_contexts:
        source: https://github.com/Innocent9712/much-to-do.git#c483fda7d1c1f6c996a95de5343cba026e932706:Server/MuchToDo
    image: muchtodo-backend:assessment
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://mongodb:27017/much_todo_db"
      DB_NAME: much_todo_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY before running Compose}
      JWT_EXPIRATION_HOURS: "72"
      ENABLE_CACHE: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app_network
    restart: unless-stopped

volumes:
  mongodb_data:
    name: muchtodo_mongodb_data

networks:
  app_network:
    name: muchtodo_app_network
    driver: bridge
